instructionsMarkdown = '''
* Click on the link provided for the EPA Smart Location database,  [available here](https://epa.maps.arcgis.com/home/webmap/viewer.html?webmap=137d4e512249480c980e00807562da10).
* Click on the “Content” button in the top left corner, under the “Basemap” button
  * Click on the sideways carrot button to the left of “SmartLocationDatabase” to expand it into a dropdown menu
  * Click on the box for “Street intersection density” to take it off the map, and any other checked boxes
  * Check the box titled “Land use diversity”
  * Enter the address for the project area inside the text box in the top right corner and hit the search button
* Click on the magnifying glass in the top right corner and enter the address for the project area inside the text box that appears.
  * Zoom in or out on the map to view entire project area
* On the left, click on "Basemap" (the icon with four small squares) and select "Imagery Hybrid."
* Click on "Legend” in the top left corner
* Cross-reference color(s) in the project area with the color/number range listed
  * If the project area straddles multiple color-coded zones, calculate the mid-point value for each Block Group and then compute their average. If this average is a whole number, then choose the lower interval as your response. For instance, if the average is 2, you would select 0-2 as your range, instead of 2-3.
* Click the corresponding Diversity.'''
