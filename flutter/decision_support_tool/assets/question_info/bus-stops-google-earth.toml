instructionsMarkdown = '''
* Click on the Google Earth link (LINK)
* In the search box above the map view on the top left of the screen, enter the address for the project area.
* Click the “Save to project” text
  * A small window will pop up. Select “Local KML file” to save the marker on the selected address.
  * Click “Save to project” again to mark the location.
* Click “View” text at the top of the search bar, then select “Basemap settings”.
  * In the pop-up window, scroll to “Details” and choose “Everything” to display bus stops with bus symbols that will appear on the map.
* Zoom in and out (as needed) until the map displays about 1/4 mile in each direction from the project area. 
* Click the “Measurement” icon (a ruler)
  * Click on a point in the project area and then drag the measurement line to the nearest part of the bus stop symbol to reveal the distance. A quarter-mile is 1,320 feet.
  * Continue this process until it is clear if there are  0 or 1 or more bus stops within 1/4 mile. If there is at least 1 bus stop within ¼ mile, select option “1 or more”; if there are no bus stops within ¼ mile, select option “0.”'''
